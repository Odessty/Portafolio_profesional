<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Portafolio | Sebastian Medina</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--CSS de bootstrap desde CDN-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Iconos de Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-light">
    <!--navegacion parte superior-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">portafolio</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav-ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#hero">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#proyectos">Proyectos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#skills">Habilidades</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contacto">Contacto</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!--hero section con flexbox para centrado-->
    <header
      id="hero"
      class="d-flex align-items-center min-vh-100 bg-primary text-white text-center py-5"
    >
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6">
            <!-- Imagen circular de perfil -->
            <img
              src="assets/profile.jpg"
              alt="Foto de Sebastián Medina"
              class="rounded-circle img-fluid mb-4 shadow"
              style="width: 180px; height: 180px; object-fit: cover"
            />

            <h1 class="display-4 fw-bold">Sebastián Medina</h1>
            <p class="lead mb-4">
              Estudiante de Ingeniería en TI | Desarrollador Software Junior | Aficionado de la ciberseguridad
            </p>

            <!-- Botones de llamada a la acción con Flexbox -->
            <div class="d-flex justify-content-center gap-3 flex-wrap">
              <a
                href="#proyectos"
                class="btn btn-light btn-lg fw-semibold shadow-sm"
                >Ver Proyectos</a
              >
              <!-- Botón para descargar el CV almacenado en /assets/ -->
              <a
                href="assets/cv_sebastian_medina.pdf"
                download="CV_Sebastian_Medina.pdf"
                class="btn btn-outline-light btn-lg fw-semibold shadow-sm"
              >
                <i class="bi bi-file-earmark-pdf-fill me-2"></i>Descargar CV
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
